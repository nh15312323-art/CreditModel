[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlab"
version = "0.1.0"
description = "Credit Model Mastery Lab - 신용평가모형 개발·검증 실전 학습 프로그램"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 2 이후에 사용하는 패키지 (Phase 1에는 필요 없음)
stats = ["statsmodels>=0.14"]
ml = ["xgboost>=2.0", "catboost>=1.2", "shap>=0.44", "imbalanced-learn>=0.11"]
dev = ["pytest>=7.4", "nbformat>=5.9", "markdown>=3.5"]
excel = ["xlrd>=2.0.1", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
