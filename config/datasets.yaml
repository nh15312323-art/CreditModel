# 데이터 레지스트리 (명세서 4.3)
# license_check.status: verified = 공식 페이지에서 확인함 / unverified = 학습자가 직접 확인 필요
datasets:
  - dataset_id: uci_default_credit_card
    name: Default of Credit Card Clients
    source_url: https://archive.ics.uci.edu/dataset/350/default+of+credit+card+clients
    download_url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
    download_method: "공식 zip 직접 다운로드(로그인 불필요). 실패하면 data/raw/ 에 수동으로 넣는다."
    expected_files: ["default of credit card clients.xls"]
    license: "CC BY 4.0"
    license_check:
      status: verified
      checked_on: "2026-10-18"
      note: "UCI 데이터셋 페이지에서 라이선스 표기를 확인함. 인용: Yeh, I-C. (2009) 및 UCI DOI 10.24432/C55S3H"
    collected_on: null           # 학습자가 내려받은 날짜를 기록 (download_file 이 자동 기록)
    sha256: null                 # 내려받은 파일의 해시 (download_file 이 자동 기록)
    version: "UCI 2016-01-25 기증본"
    unit_of_observation: "신용카드 고객 1명"
    target:
      column: "default payment next month"
      renamed_to: "default"
      definition: "다음 달(2005년 10월) 결제 불이행 여부, 1=불이행, 0=정상"
      note: "관측시점·성과관찰기간이 1개월로 매우 짧아 은행 IRB의 12개월 부도 정의와 다르다."
    observation_window: "2005-04 ~ 2005-09 (설명변수 6개월)"
    performance_window: "1개월"
    n_rows: 30000
    n_columns: 25                # ID + 23 설명변수 + 타깃
    missing_values_declared: "없음(공식 설명 기준) — 그래도 직접 확인한다"
    known_leakage_notes:
      - "설명변수는 모두 2005-09 이전 정보이므로 명백한 미래정보 변수는 없다. 그래도 학습자가 시점 관계를 직접 점검한다."
    caveats:
      - "대만 카드 고객 데이터(2005년). 한국 은행 고객·상품·시점을 대표하지 않는다."
      - "SEX, EDUCATION, MARRIAGE 는 민감할 수 있는 속성이다. 실제 모형에 쓰는 것은 공정성·법규 검토 대상이다."
      - "시간(월) 정보가 한 시점 스냅샷이라 진정한 out-of-time 검증을 만들 수 없다."
    suitability: "단변량·다변량 분석, 로지스틱 회귀, 트리 모델, 평가지표 교육용"

  - dataset_id: synthetic_loan_v1
    name: 합성 소액대출 데이터 (creditlab 내장)
    source_url: null
    download_url: null
    download_method: "creditlab.data.make_synthetic_credit_data(seed=...) 로 즉석 생성 (인터넷 불필요)"
    license: "프로젝트 내장 생성기 (실제 고객 데이터 아님)"
    license_check:
      status: verified
      checked_on: "2026-10-18"
      note: "코드로 생성하므로 외부 라이선스 없음"
    unit_of_observation: "가상의 대출 신청 1건"
    target:
      column: "default"
      definition: "신청 후 12개월 내 90일 이상 연체 여부(가상), 1=부도"
    n_rows: 5000
    known_leakage_notes:
      - "의도적 누수 변수는 Phase 2 이후 레슨에서 별도 추가한다."
    caveats:
      - "알려진 확률식으로 만든 데이터다. 이 데이터에서의 성능은 실제 모집단 성능의 근거가 아니다."
      - "품질 점검 연습을 위해 결측·중복·범위 오류를 일부러 주입할 수 있다(옵션)."
    suitability: "오프라인 테스트, 알고리즘·파이프라인 시험, 품질 점검 연습"
